<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Live Object Detection - VisionStream</title>

    <!-- jQuery -->
    <script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>

    <!-- Socket.IO -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/socket.io/4.6.1/socket.io.js"></script>

    <!-- Bootstrap 5 -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.2.3/dist/css/bootstrap.min.css" rel="stylesheet"
        integrity="sha384-rbsA2VBKQhggwzxH7pPCaAqO46MgnOM80zW1RWuH61DGLwZJEdK2Kadq2F9CUG65" crossorigin="anonymous">
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.2.3/dist/js/bootstrap.bundle.min.js"
        integrity="sha384-kenU1KFdBIe4zVF0s0G1M5b4hcpxyD9F7jL+jjXkk+Q2h455rYXK/7HAuoJl+0I4"
        crossorigin="anonymous"></script>

    <!-- Bootstrap Icons -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.4/font/bootstrap-icons.css">

    <!-- Custom CSS -->
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">

    <!-- Custom JavaScript -->
    <script type="text/javascript" src="{{ url_for('static', filename='script.js') }}"></script>
</head>

<body>
    <!-- Navigation -->
    <nav class="navbar">
        <div class="container-fluid">
            <a class="navbar-brand" href="/">
                <i class="bi bi-camera-video-fill me-2"></i>VisionStream
            </a>
            <span class="text-secondary">Real-time Object Detection</span>
        </div>
    </nav>

    <!-- Control Panel -->
    <div class="container-fluid mt-4">
        <div class="glass-card mb-4">
            <h4 class="mb-4">
                <i class="bi bi-sliders me-2"></i>Control Panel
            </h4>

            <div class="row g-4">
                <!-- Toggle Controls -->
                <div class="col-lg-9">
                    <div class="row g-3">
                        <!-- Show Stream Toggle -->
                        <div class="col-md-4">
                            <div class="control-card text-center">
                                <label for="turn_off" class="form-label mb-3">
                                    <i class="bi bi-display me-2"></i>Show Stream
                                </label>
                                <br>
                                <label class="switch">
                                    <input id="turn_off" value="1" name="turn_off" type="checkbox"
                                        onclick="toggleOffSwitch()" />
                                    <span class="slider round"></span>
                                </label>
                            </div>
                        </div>

                        <!-- Flip Horizontally Toggle -->
                        <div class="col-md-4">
                            <div class="control-card text-center">
                                <label for="flip-horizontal" class="form-label mb-3">
                                    <i class="bi bi-arrow-left-right me-2"></i>Flip Horizontally
                                </label>
                                <br>
                                <label class="switch">
                                    <input id="flip-horizontal" value="0" name="flip-horizontal" type="checkbox"
                                        onclick="toggleHSwitch()" />
                                    <span class="slider round"></span>
                                </label>
                            </div>
                        </div>

                        <!-- Run Detection Toggle -->
                        <div class="col-md-4">
                            <div class="control-card text-center">
                                <label for="run_detection" class="form-label mb-3">
                                    <i class="bi bi-lightning-charge-fill me-2"></i>Run Detection
                                </label>
                                <br>
                                <label class="switch">
                                    <input id="run_detection" value="0" name="run_detection" type="checkbox"
                                        onclick="toggleDetSwitch()" />
                                    <span class="slider round"></span>
                                </label>
                            </div>
                        </div>
                    </div>
                </div>

                <!-- Confidence Threshold Slider -->
                <div class="col-lg-3">
                    <div class="control-card text-center">
                        <form action="/" method="POST">
                            <label for="slider" class="form-label mb-3">
                                <i class="bi bi-speedometer2 me-2"></i>Confidence Threshold
                            </label>
                            <br>
                            <input type="range" id="slider" name="slider" min="50" max="100" value="75" class="mb-3">
                        </form>
                        <input type="hidden" id="sliderValue" name="sliderValue" value="75">
                        <br>
                        <span id="conf_display">75</span>
                        <span class="text-muted ms-1">%</span>
                    </div>
                </div>
            </div>
        </div>

        <!-- Video Stream and Output Section -->
        <div class="row g-4">
            <!-- Live Stream -->
            <div class="col-lg-6">
                <div class="mb-3">
                    <h4>
                        <i class="bi bi-camera-video me-2"></i>Live Stream
                    </h4>
                </div>
                <div id="container">
                    <img src="/video_feed" id="videoElement" alt="Video Stream">
                </div>
            </div>

            <!-- Detection Output -->
            <div class="col-lg-6">
                <div class="mb-3">
                    <h4>
                        <i class="bi bi-terminal me-2"></i>Detection Output
                    </h4>
                </div>
                <div id="terminal"></div>
            </div>
        </div>

        <!-- Back Button -->
        <div class="text-center mt-5 mb-5">
            <button class="btn btn-dark px-5 py-3" id="stop-button" type="button"
                onclick="stopProcess('Stopping video stream...')">
                <i class="bi bi-house-fill me-2"></i>Back to Homepage
            </button>
        </div>
    </div>

    <!-- Footer -->
    <footer class="text-center">
        <div class="container">
            <!-- <p class="mb-0">
                Built with <i class="bi bi-heart-fill text-danger"></i> using
                <a href="https://github.com/ultralytics/ultralytics">YOLOv8</a>,
                Flask, and OpenCV
            </p> -->
        </div>
    </footer>
</body>

</html>
